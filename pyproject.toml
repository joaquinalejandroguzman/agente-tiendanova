[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cotejo"
version = "0.1.0"
description = "Consulta sobre la documentacion interna de una PyME, con un router determinista antes del modelo."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Joaquín A. Guzmán" }]

# El piso es 3.12: es el interprete por defecto de Streamlit Community
# Cloud, que es donde se despliega. El CI ademas ejercita 3.13 y 3.14, que
# Community Cloud tambien soporta.
requires-python = ">=3.12"

dependencies = [
    "streamlit>=1.36",
    "pypdf>=4.0",
    "pandas>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-playwright>=0.5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    # Solo para generar el corpus de demostracion (scripts/generar_corpus.py).
    # No corre en produccion, por eso no va en requirements.txt.
    "reportlab>=4.0",
]

[project.urls]
Repository = "https://github.com/joaquinalejandroguzman/cotejo"

# El proyecto sigue siendo un conjunto plano de modulos en la raiz.
# Declararlos explicitamente mantiene funcionando `pip install -e .`; esta
# lista se reemplaza por descubrimiento automatico cuando los modulos pasen a
# vivir dentro de un paquete.
[tool.setuptools]
py-modules = ["app", "router", "doc_selector", "groq_client", "pdf_utils", "tabla_utils", "ingesta", "bm25", "historial", "resumen"]

# ---------------------------------------------------------------------------
# Ruff: linter y formateador (reemplaza a flake8, black e isort)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort — import ordering
    "N",    # pep8-naming
    "UP",   # pyupgrade — modern syntax
    "B",    # flake8-bugbear — likely bugs
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib — os.path is legacy
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific rules
]
ignore = [
    # La superficie del producto es en espanol a proposito (interfaz, prompt
    # del modelo, respuestas del router). Las advertencias de unicode ambiguo
    # se disparan con acentos legitimos y aca serian puro ruido.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Archivo de contenido: textos legales y comerciales largos. Partirlos a 100
# columnas los vuelve mas dificiles de leer y editar, no menos.
"scripts/generar_corpus.py" = ["E501"]
# Los tests pueden tapar nombres y usar aserciones con libertad.
"tests/**" = ["ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["app", "router", "doc_selector", "groq_client", "pdf_utils", "tabla_utils", "ingesta", "bm25", "historial", "resumen"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy: verificacion estatica de tipos
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true

# Paquetes de terceros que no traen informacion de tipos.
[[tool.mypy.overrides]]
module = ["streamlit.*", "pypdf.*", "pandas.*", "reportlab.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Los tests de punta a punta levantan un servidor Streamlit real y manejan un
# navegador, asi que quedan fuera de la corrida por defecto y se invocan
# explicitamente con `make test-e2e`.
addopts = "-m 'not e2e'"
markers = [
    "e2e: test de punta a punta que maneja un navegador real contra la app (lento)",
]

# ---------------------------------------------------------------------------
# Cobertura
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "*/site-packages/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
